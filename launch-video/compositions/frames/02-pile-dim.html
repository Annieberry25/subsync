    <script>
      // "The pile dims" — a cut continuation of tps-pile. Everything the handoff
      // binds (phone geometry, the three cards, the outer glow) is already in
      // its resolved state at t=0 and is never touched by a tween: the cut
      // cannot jump. Motion register: fromTo entrances, power3 settles, no
      // overshoot, no exits — the frame resolves and holds.
      const tl = gsap.timeline({ paused: true });

      const statNum = document.getElementById("tp2-stat-num");
      const amberGlow = document.getElementById("tp2-amber-glow");

      // Handoff lock — the phone is motionless at opacity 1, as frame 1 left it.
      tl.set("#tp2-phone", { opacity: 1 }, 0);
      // The counter's t=0 readout, so a seek to any frame inside Scene 1 shows
      // the pre-count state rather than the baked final value.
      tl.set(statNum, { textContent: "0.0%" }, 0);

      // ── Scene 1 (0.0-1.2s) — the pile dims. The veil does all the dimming;
      //    the three cards stay at opacity 1 beneath it.
      tl.fromTo("#tp2-veil", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);

      // ── Scene 2 (1.2-3.4s) — the stat lands. Count value and scale growth
      //    share one position and one ease so number + weight arrive as a beat.
      const count = { value: 0 };
      tl.fromTo("#tp2-stat-num", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 1.2);
      tl.to(
        count,
        {
          value: 59.9,
          duration: 1.4,
          ease: "power3.out",
          onUpdate: () => {
            statNum.textContent = count.value.toFixed(1) + "%";
          },
        },
        1.2,
      );
      tl.fromTo("#tp2-stat-num", { scale: 1.14 }, { scale: 1, duration: 1.4, ease: "power3.out" }, 1.2);
      // The two-line label completes the lockup in one slow pass.
      tl.fromTo("#tp2-stat-label", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" }, 2.5);

      // ── Scene 3 (3.4-4.6s) — the fourth charge drops into the stack last and
      //    settles amber; a bounded halo blooms behind it as one beat.
      tl.fromTo(
        "#tp2-amber",
        { opacity: 0, scale: 0.92, y: -30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" },
        3.45,
      );
      tl.fromTo(amberGlow, { opacity: 0, scale: 0.82 }, { opacity: 0.32, scale: 1, duration: 0.85, ease: "power2.out" }, 3.45);

      // ── Scene 4 (4.6-7.0s) — resolved. The glow's bounded idle breathe: one
      //    finite phase tween, never a repeat, dead still at 7.0s.
      const GLOW_PEAK = 0.32;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2,
          duration: 2.7,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            amberGlow.style.opacity = String(GLOW_PEAK + s * 0.03);
            amberGlow.style.transform = `scale(${1 + s * 0.015})`;
          },
        },
        4.3,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["tps-pile-dim"] = tl;
    </script>
