    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#ch-reel", { scale: 1.02 }, { scale: 1.14, duration: 5, ease: "none" }, 0);
      tl.fromTo("#ch-head", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.12);

      tl.fromTo(
        "#ch-dot",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.12
      );
      tl.to("#ch-dot", { opacity: 0.3, duration: 0.55, repeat: 5, yoyo: true, ease: "none" }, 0.9);

      tl.fromTo(
        ".ch-chip",
        { opacity: 0, x: 90 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.38 },
        0.7
      );

      tl.fromTo("#ch-total-wrap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.35 }, 3.25);

      const counter = { v: 0 };
      tl.to(
        counter,
        {
          v: 267.47,
          duration: 1.1,
          ease: "power1.out",
          onUpdate: () => {
            document.getElementById("ch-total").textContent =
              "$" + counter.v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          },
        },
        3.35
      );

      tl.fromTo("#ch-trial", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.5);

      tl.set("#ch-trial", { opacity: 1 }, 5);

      window.__timelines = window.__timelines || {};
      window.__timelines["charges"] = tl;
