<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Space Grotesk variable — the same face the SubHalt app ships
         (app/layout.tsx uses next/font/google Space_Grotesk, latin subset).
         Axis range is 300-700; nothing in this composition asks for more. */
      @font-face {
        font-family: 'Space Grotesk';
        src: url('assets/fonts/space-grotesk-var.woff2') format('woff2');
        font-weight: 300 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0d0d;
        font-family: 'Space Grotesk', sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-5nhf"
      id="root"
      data-composition-id="launch"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- S1 hook 0-3 -->
      <div data-hf-id="hf-lxp1"
        class="clip"
        id="s-hook"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 2"
      ></div>

      <!-- S2 agitate 3-8 -->
      <div data-hf-id="hf-b511"
        class="clip"
        id="s-charges"
        data-composition-id="charges"
        data-composition-src="compositions/02-charges.html"
        data-start="3"
        data-duration="5"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 2"
      ></div>

      <!-- S3 solution 8-15 -->
      <div data-hf-id="hf-ptkm"
        class="clip"
        id="s-dashboard"
        data-composition-id="dashboard"
        data-composition-src="compositions/03-dashboard.html"
        data-start="8"
        data-duration="7"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 2"
      ></div>

      <!-- S4 end card 15-20, tagline lands just after the wordmark -->
      <div data-hf-id="hf-zmq4"
        class="clip"
        id="s-endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/07-endcard.html"
        data-start="15"
        data-duration="5"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 4"
      ></div>

      <div data-hf-id="hf-ho93"
        class="clip"
        id="s-overlay"
        data-composition-id="overlay"
        data-composition-src="compositions/06-overlay.html"
        data-start="0"
        data-duration="20"
        data-track-index="2"
        style="position: absolute; inset: 0; z-index: 20; pointer-events: none"
      ></div>

      <audio data-hf-id="hf-3adx"
        id="music"
        data-start="0"
        data-duration="20"
        data-track-index="3"
        data-volume="0.8"
        data-fade-out="1.2"
        src="assets/music.m4a"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["launch"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
