name: Renewal reminders

# Vercel Hobby only allows daily crons, and the reminder schedule needs more
# resolution than that: the automatic stages are a daily 09:00 UTC run, but the
# final-hours push has a window of [renewal - 3h, renewal) and a single run never
# lands inside it. This workflow gives the endpoint an hourly trigger so that
# stage can be delivered, without paying for a Pro plan.
#
# It is safe to run alongside the Vercel cron. Every send is claimed in
# reminder_deliveries under a unique key of (subscription, renewal, lead offset,
# channel), so whichever run reaches a reminder first wins and the other skips it
# as already_delivered. Concurrent runs cannot double-send.
on:
  schedule:
    # Hourly, a few minutes past the hour so this does not fire on the same
    # minute as the Vercel cron and race it every day.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  # The endpoint is idempotent, but skipping an overlapping tick keeps the run
  # logs readable.
  group: send-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the reminder run
        run: |
          curl --fail --silent --show-error --max-time 240 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://subhalt.xyz/api/cron/send-reminders?dryRun=0"