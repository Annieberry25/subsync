name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # lib/env.ts validates at import time, so `next build` cannot even collect
      # page data without these two. Actions has no .env.local, so fall back to
      # inert placeholders; nothing in CI serves traffic. Real values win if the
      # secrets are ever configured.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: pdfjs-dist v6 calls Promise.withResolvers unconditionally,
          # which only exists from Node 22. Under 20 every receipt-PDF test throws
          # TypeError before it can assert anything. Matches the local toolchain
          # (Node 24) closely enough and the Vercel runtime.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
