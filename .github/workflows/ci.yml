name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: pdfjs-dist v6 calls Promise.withResolvers unconditionally,
          # which only exists from Node 22. Under 20 every receipt-PDF test throws
          # TypeError before it can assert anything. Matches the local toolchain
          # (Node 24) closely enough and the Vercel runtime.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
